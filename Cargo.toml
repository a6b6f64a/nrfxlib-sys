[package]
name = "nrfxlib-sys"
version = "4.0.0+3.4.0"
links = "nrfxlib_sys"
authors = [
	"Jonathan 'theJPster' Pallant <github@thejpster.org.uk>",
	"42 Technology Ltd <jonathan.pallant@42technology.com>",
	"Dion Dokter <diondokter@gmail.com>",
]
edition = "2021"
description = "Rust bindings to the Nordic nRF91* Socket Library."
readme = "README.md"
license-file = "LICENCE.md"
repository = "https://github.com/nrf-rs/nrfxlib-sys"

# The nrfxlib folder is quite large, so only include the pieces we need
include = [
	"src/**",
	"include/**",
	"build.rs",
	"wrapper.h",
	"*.md",
	"third_party/nordic/nrfxlib/nrf_modem/lib/cellular/nrf9160/hard-float/libmodem.a",
	"third_party/nordic/nrfxlib/nrf_modem/lib/cellular/nrf9160/hard-float/libmodem_log.a",
	"third_party/nordic/nrfxlib/nrf_modem/lib/cellular/nrf9120/hard-float/libmodem.a",
	"third_party/nordic/nrfxlib/nrf_modem/lib/cellular/nrf9120/hard-float/libmodem_log.a",
	"third_party/nordic/nrfxlib/nrf_modem/lib/dect_phy/libmodem.a",
	"third_party/nordic/nrfxlib/nrf_modem/lib/dect_phy/libmodem_log.a",
	"third_party/nordic/nrfxlib/nrf_modem/lib/dect/nrf9120/hard-float/libmodem.a",
	"third_party/nordic/nrfxlib/nrf_modem/lib/dect/nrf9120/hard-float/libmodem_log.a",
	"third_party/nordic/nrfxlib/nrf_modem/include/**",
	"third_party/nordic/nrfxlib/nrf_modem/license.txt",
	"third_party/nordic/nrfxlib/nrf_modem/README.rst",
	"third_party/nordic/nrfxlib/crypto/nrf_cc310_platform/include/**",
	"third_party/nordic/nrfxlib/crypto/nrf_cc310_platform/license.txt",
	"third_party/nordic/nrfxlib/crypto/nrf_cc310_platform/lib/cortex-m33/hard-float/no-interrupts/libnrf_cc310_platform_0.9.22.a",
	"third_party/nordic/nrfxlib/crypto/nrf_cc312_platform/include/**",
	"third_party/nordic/nrfxlib/crypto/nrf_cc312_platform/license.txt",
	"third_party/nordic/nrfxlib/crypto/nrf_cc312_platform/lib/cortex-m33/hard-float/no-interrupts/libnrf_cc312_platform_0.9.22.a",
	"third_party/nordic/nrfxlib/crypto/nrf_cc310_mbedcrypto/include/**",
	"third_party/nordic/nrfxlib/crypto/nrf_cc310_mbedcrypto/license.txt",
	"third_party/nordic/nrfxlib/crypto/nrf_cc312_mbedcrypto/include/**",
	"third_party/nordic/nrfxlib/crypto/nrf_cc312_mbedcrypto/license.txt",
	"third_party/nordic/nrfxlib/crypto/nrf_cc312_mbedcrypto/lib/cortex-m33/hard-float/no-interrupts/libnrf_cc312_core_0.9.22.a",
	"third_party/nordic/nrfxlib/crypto/nrf_cc312_mbedcrypto/lib/cortex-m33/hard-float/no-interrupts/libnrf_cc312_psa_crypto_0.9.22.a",
	"third_party/nordic/nrfxlib/crypto/nrf_oberon/lib/cortex-m33/hard-float/**",
	"third_party/nordic/nrfxlib/crypto/nrf_oberon/include/**",
	"third_party/nordic/nrfxlib/crypto/nrf_oberon/license.txt",
	"third_party/nordic/nrfxlib/nrf_fuel_gauge/include/**",
	"third_party/nordic/nrfxlib/nrf_fuel_gauge/lib/cortex-m33/hard-float/libnrf_fuel_gauge.a",
	"third_party/nordic/nrfxlib/nrf_fuel_gauge/lib/cortex-m33/hard-float/libnrf_fuel_gauge_primary.a",
	"third_party/nordic/nrfxlib/nrf_fuel_gauge/lib/cortex-m33/soft-float/libnrf_fuel_gauge.a",
	"third_party/nordic/nrfxlib/nrf_fuel_gauge/lib/cortex-m33/soft-float/libnrf_fuel_gauge_primary.a",
	"third_party/nordic/nrfxlib/nrf_fuel_gauge/license.txt",
]

[package.metadata.docs.rs]
features = ["nrf9160"]

[dependencies]

[build-dependencies]
regex = "1"
bindgen = "0.70"
llvm-tools = { version = "0.1.1", optional = true }

[features]
default = ["llvm-objcopy"]
arm-none-eabi-objcopy = []
llvm-objcopy = ["dep:llvm-tools"]
log = []

## Links the DECT PHY modem library variant (lib/dect_phy/libmodem.a)
##
## Pair with the DECT PHY radio-core firmware. Exposes the PHY API
## (`nrf_modem_dect_phy_*`) and the clock sync API
## (`nrf_modem_dect_clock_sync_*`).
##
## The radio-core firmware is not shipped in this crate.
dect-phy = []

## Links the DECT NR+ MAC/DLC modem library variant (lib/dect/libmodem.a,
## libmodem 3.3.0+)
##
## Pair with the DECT NR+ (MAC) radio-core firmware. This is a
## strict superset of `dect-phy`: it exports the same PHY + clock_sync
## symbols and additionally the MAC (`nrf_modem_dect_mac_*`), DLC
## (`nrf_modem_dect_dlc_*`), and control (`nrf_modem_dect_control_*`)
## surfaces declared in `nrf_modem_dect.h`.
##
## Note: `nrf_modem_dect.h` is distributed under a more restrictive license
## than the rest of nrfxlib (Nordic confidential). Confirm your usage rights
## with Nordic before enabling this feature in a shipping product.
dect-mac = []

nrf9160 = []
nrf9151 = ["nrf9120"]
nrf9161 = ["nrf9120"]
# The nrf9120 is the part number of the SoC internal to the nrf9151 and nrf9161 SiPs
nrf9120 = []
## The nRF5340 has no modem: the modem headers and library are left out.
nrf5340 = []
## Links CC312 verifier and platform archives. Requires nrf5340.
cc312 = ["nrf5340"]
## Bindings and link for the nRF Fuel Gauge library (secondary cell; wins if both are set)
nrf_fuel_gauge = []
## Same, for the primary-cell variant
nrf_fuel_gauge_primary_cell = []
